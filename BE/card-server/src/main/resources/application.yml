server:
  port: 8082

spring:
  application:
    name: card-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/card_db
    username: ${DB_USERNAME:card}
    password: ${DB_PASSWORD:card}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
