server:
  port: 8081

spring:
  application:
    name: pg-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pg_db
    username: ${DB_USERNAME:pg}
    password: ${DB_PASSWORD:pg}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

paypipe:
  card-server:
    base-url: ${CARD_SERVER_URL:http://localhost:8082}
