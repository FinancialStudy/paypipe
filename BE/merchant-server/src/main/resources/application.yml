server:
  port: 8080

spring:
  application:
    name: merchant-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/merchant_db
    username: ${DB_USERNAME:merchant}
    password: ${DB_PASSWORD:merchant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

paypipe:
  pg-server:
    base-url: ${PG_SERVER_URL:http://localhost:8081}
